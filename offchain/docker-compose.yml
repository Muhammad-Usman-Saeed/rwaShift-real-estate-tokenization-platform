version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rwashift
      MYSQL_USER: rwashift
      MYSQL_PASSWORD: rwashift
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      anvil:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rwashift
      DB_USERNAME: rwashift
      DB_PASSWORD: rwashift
      OAUTH2_ISSUER_URI: http://localhost:8080
      BLOCKCHAIN_NETWORK: anvil
      BLOCKCHAIN_CHAIN_ID: 31337
      BLOCKCHAIN_RPC_URL: http://anvil:8545
      BLOCKCHAIN_CONFIRMATIONS: 1
      # Set after running the onchain/ project's DeployLocal.s.sol against this same Anvil instance
      # (see onchain/README.md) and copying addresses from onchain/deployments/local.json:
      TOKEN_FACTORY_ADDRESS: ${TOKEN_FACTORY_ADDRESS:-}
      IDENTITY_GATEWAY_ADDRESS: ${IDENTITY_GATEWAY_ADDRESS:-}
      DISTRIBUTION_REGISTRY_ADDRESS: ${DISTRIBUTION_REGISTRY_ADDRESS:-}
      BLOCKCHAIN_AGENT_PRIVATE_KEY: ${BLOCKCHAIN_AGENT_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ORG_WALLET_MASTER_KEY: ${ORG_WALLET_MASTER_KEY:-2SdLQlXkonyIAydL6CTeheLs1rR7/Najn8ty4QScurQ=}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: rwashift-platform
      DOCUMENT_STORAGE_ROOT: /app/data/documents
      RWASHIFT_SEED_ENABLED: ${RWASHIFT_SEED_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - documents-data:/app/data/documents

volumes:
  mysql-data:
  documents-data:
