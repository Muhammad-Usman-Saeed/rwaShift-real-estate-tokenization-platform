databaseChangeLog:
  - changeSet:
      id: activity-001-platform-visit
      author: rwashift
      changes:
        - createTable:
            tableName: platform_visit
            columns:
              - column: { name: id, type: VARCHAR(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: VARCHAR(26), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: visit_date, type: DATE, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: platform_visit
            columnNames: user_id, visit_date
            constraintName: uq_platform_visit_user_date
        - createIndex:
            tableName: platform_visit
            indexName: idx_platform_visit_date
            columns:
              - column: { name: visit_date }
