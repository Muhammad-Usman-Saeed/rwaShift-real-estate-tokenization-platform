databaseChangeLog:
  - changeSet:
      id: iam-002-organization-membership
      author: rwashift
      changes:
        - createTable:
            tableName: organization_membership
            columns:
              - column: { name: id, type: VARCHAR(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: VARCHAR(26), constraints: { nullable: false } }
              - column: { name: organization_id, type: VARCHAR(26), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: organization_membership
            columnNames: user_id, organization_id
            constraintName: uq_membership_user_org
        - addForeignKeyConstraint:
            baseTableName: organization_membership
            baseColumnNames: user_id
            referencedTableName: platform_user
            referencedColumnNames: id
            constraintName: fk_membership_user
        - createIndex:
            tableName: organization_membership
            indexName: idx_membership_org
            columns:
              - column: { name: organization_id }
