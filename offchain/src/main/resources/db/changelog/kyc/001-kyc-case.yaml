databaseChangeLog:
  - changeSet:
      id: kyc-001-kyc-case
      author: rwashift
      changes:
        - createTable:
            tableName: kyc_case
            columns:
              - column: { name: id, type: VARCHAR(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: investor_id, type: VARCHAR(26), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_kyc_investor } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: provider_reference, type: VARCHAR(200) }
              - column: { name: submitted_at, type: TIMESTAMP }
              - column: { name: reviewed_at, type: TIMESTAMP }
              - column: { name: reviewed_by, type: VARCHAR(26) }
              - column: { name: rejection_reason, type: VARCHAR(1000) }
              - column: { name: version, type: BIGINT, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: kyc_case
            baseColumnNames: investor_id
            referencedTableName: investor
            referencedColumnNames: id
            constraintName: fk_kyc_investor
