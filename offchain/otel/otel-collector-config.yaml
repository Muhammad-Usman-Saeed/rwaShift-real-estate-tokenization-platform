receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Local dev default: print everything to the collector's own stdout. Swap for an OTLP exporter
  # pointed at a real backend (Tempo/Jaeger for traces, Prometheus/Mimir for metrics, Loki for
  # logs) in a non-local environment — nothing in the application changes either way.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
