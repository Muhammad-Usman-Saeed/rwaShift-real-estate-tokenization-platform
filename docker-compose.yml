# Aggregated stack for RWA Shift Real Estate: on-chain deployment, the Spring Boot API +
# Authorization Server, and the Next.js frontend, wired together end to end.
#
#   docker compose up --build
#
# Then open http://localhost:3000. The demo scenario (ABC Real Estate / Dubai Business Tower) is
# seeded automatically (RWASHIFT_SEED_ENABLED=true below) once the on-chain contracts and the
# database are ready — see frontend/README.md for the full guided walkthrough.
#
# This is a local/demo composition only: the deployer key, agent key, and Auth.js secret below
# are well-known development defaults (the same ones onchain/README.md and offchain/README.md
# already document), never real credentials. Override them via a `.env` file at this directory's
# root (see `.env.example`) for anything beyond local use.

services:
  # ---------------------------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rwashift
      MYSQL_USER: rwashift
      MYSQL_PASSWORD: rwashift
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./offchain/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # ---------------------------------------------------------------------------------------------
  # On-chain deployment (one-shot) — deploys the ERC-3643/T-REX platform + RWA Shift's own
  # contracts to the anvil service above, then exits. See onchain/README.md#local-development.
  # ---------------------------------------------------------------------------------------------
  contracts-deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /workspace
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        # The named volume below is created root-owned by Docker on first use; forge (running
        # as root here — see `user:`) needs it world-writable so `vm.writeJson` can create
        # deployments/local.json, and world-readable so the (non-root) app container can read it.
        chmod 777 /workspace/deployments
        forge build
        # Idempotency guard: anvil has no persistent volume (a container restart wipes its chain),
        # but this service can also be re-run on its own against an ALREADY-running, unchanged
        # anvil (e.g. `docker compose up` invoked again while anvil is still up from before). Since
        # every run deploys a fresh contract suite at new addresses, re-running against a live
        # chain orphans anything already tokenized against the previous addresses (identity
        # registries, agent roles, running app config) instead of actually fixing anything — see
        # docs/critical-analysis.md. Only redeploy when the previous deployment's own factory
        # address has no code on the current chain, i.e. anvil genuinely restarted.
        FACTORY=$(grep -o '"rwaShiftTokenFactory": *"[^"]*"' /workspace/deployments/local.json 2>/dev/null | cut -d'"' -f4)
        if [ -n "$$FACTORY" ] && [ "$(cast codesize "$$FACTORY" --rpc-url http://anvil:8545 2>/dev/null || echo 0)" != "0" ]; then
          echo "Existing deployment at $$FACTORY is still live on this chain — skipping redeploy."
        else
          forge script script/DeployLocal.s.sol:DeployLocal --rpc-url http://anvil:8545 --broadcast
        fi
        chmod -R a+r /workspace/deployments
    volumes:
      - ./onchain:/workspace
      - contract-deployments:/workspace/deployments
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # Off-chain platform (Spring Boot: REST API + OAuth2/OIDC Authorization Server)
  # ---------------------------------------------------------------------------------------------
  app:
    build: ./offchain
    entrypoint: ["sh", "/docker/entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      anvil:
        condition: service_healthy
      otel-collector:
        condition: service_started
      contracts-deploy:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rwashift
      DB_USERNAME: rwashift
      DB_PASSWORD: rwashift
      # Browser-facing — must match AUTH_ISSUER below exactly (it's baked into every token's
      # `iss` claim and used for the OAuth2 authorization redirect the user's browser follows).
      OAUTH2_ISSUER_URI: http://localhost:8080
      # Where the backend's own /login sends a user back if they reach it with no in-flight
      # OAuth2 authorization request (e.g. hit :8080 directly instead of starting at :3000).
      FRONTEND_URL: http://localhost:3000
      BLOCKCHAIN_NETWORK: anvil
      BLOCKCHAIN_CHAIN_ID: 31337
      BLOCKCHAIN_RPC_URL: http://anvil:8545
      BLOCKCHAIN_CONFIRMATIONS: 1
      # TOKEN_FACTORY_ADDRESS / IDENTITY_GATEWAY_ADDRESS / DISTRIBUTION_REGISTRY_ADDRESS are set
      # by docker/entrypoint.sh at container start, read from contracts-deploy's output — not
      # listed here since they don't exist until that service has actually run.
      BLOCKCHAIN_AGENT_PRIVATE_KEY: ${BLOCKCHAIN_AGENT_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      # AES-256 master key (base64) encrypting each organization's own on-chain wallet at rest —
      # local-dev-only value, generated with `openssl rand -base64 32`. A real deployment must
      # supply its own via a secret manager, never a compose default.
      ORG_WALLET_MASTER_KEY: ${ORG_WALLET_MASTER_KEY:-2SdLQlXkonyIAydL6CTeheLs1rR7/Najn8ty4QScurQ=}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: rwashift-platform
      DOCUMENT_STORAGE_ROOT: /app/data/documents
      # Persisted across container recreation (see the jwt-signing-key volume below) so restarting
      # the app doesn't silently invalidate every previously-issued access/ID token.
      JWT_SIGNING_KEY_PATH: /app/data/jwt-signing-key-dir/jwt-signing-key
      RWASHIFT_SEED_ENABLED: ${RWASHIFT_SEED_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - documents-data:/app/data/documents
      - jwt-signing-key:/app/data/jwt-signing-key-dir
      - contract-deployments:/deployments:ro
      - ./offchain/docker/entrypoint.sh:/docker/entrypoint.sh:ro

  # ---------------------------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # See the ARG/ENV block in frontend/Dockerfile — these must be build args, not just
        # runtime `environment:` below, because Next.js inlines NEXT_PUBLIC_* at build time.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_CHAIN: anvil
        NEXT_PUBLIC_ANVIL_RPC_URL: http://localhost:8545
        NEXT_PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        NEXT_PUBLIC_SEPOLIA_EXPLORER_URL: https://sepolia.etherscan.io
        NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces
        NEXT_PUBLIC_OTEL_SERVICE_NAME: rwashift-frontend
    depends_on:
      app:
        condition: service_started
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-secret-change-me}
      # Browser-facing issuer/authorization endpoint (must match the backend's OAUTH2_ISSUER_URI).
      AUTH_ISSUER: http://localhost:8080
      # Server-to-server (this container -> the app container): discovery, token exchange,
      # userinfo, jwks, and refresh all happen here, in Node, inside this container — "localhost"
      # would resolve to this container itself, not the backend, hence the separate address.
      AUTH_INTERNAL_ISSUER: http://app:8080
      AUTH_CLIENT_ID: rwashift-web
      AUTH_CLIENT_SECRET: rwashift-web-secret
      # Same split as AUTH_ISSUER/AUTH_INTERNAL_ISSUER, for the REST API instead of the auth server.
      API_BASE_URL: http://app:8080/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_CHAIN: anvil
      NEXT_PUBLIC_ANVIL_RPC_URL: http://localhost:8545
      NEXT_PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
      NEXT_PUBLIC_SEPOLIA_EXPLORER_URL: https://sepolia.etherscan.io
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces
      NEXT_PUBLIC_OTEL_SERVICE_NAME: rwashift-frontend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  documents-data:
  jwt-signing-key:
  contract-deployments:
